# wrangler.toml — Trustwright Worker (serves the SPA + /api/*).
#
# Deploy is human-gated (needs `wrangler login`). Before first deploy:
#   1. wrangler kv namespace create DAILY        # paste the id below
#   2. wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   3. wrangler secret put DEEPFAKE_API_KEY        # optional (detector)
#   3b. wrangler secret put DEEPFAKE_ROUTER_URL      # optional (detector endpoint)
#   3c. wrangler secret put RESEND_API_KEY           # optional (email delivery)
#   3d. wrangler secret put RESEND_FROM              # optional (verified sender)
#   3e. wrangler secret put POSTMARK_SERVER_API_KEY  # optional (badge-health alerts)
#   3f. wrangler secret put ALERT_EMAIL              # optional (where alerts go)
#   3g. wrangler secret put POSTMARK_FROM            # optional (verified sender; defaults in code)
#   4. npm run build && wrangler deploy
#
# Secrets are NEVER placed in this file.

name = "trustwright"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
# @cloudflare/puppeteer (Browser Rendering) imports node:buffer etc.
compatibility_flags = ["nodejs_compat"]

# Canonical custom domain is now trustwright.deepblocker.ai. The old
# tripwire.deepblocker.ai route is kept ONLY until openclawcity's badge embed +
# ownership proof are moved to the new domain, then it will be removed. The
# origin-trial token (public/_headers) is registered for deepblocker.ai with
# isSubdomain, so it covers the new subdomain with no new token. Requires the
# deepblocker.ai zone on this account.
# Disabled so the *.workers.dev URL (which carries the old internal worker name)
# is not publicly reachable — only the trustwright.deepblocker.ai custom domain
# serves. The worker OBJECT is still named 'tripwire' in the Cloudflare account
# (renaming it means creating a new worker + re-adding secrets — see issue #1);
# with workers_dev off, that name is no longer exposed anywhere public.
workers_dev = false
routes = [
  { pattern = "trustwright.deepblocker.ai", custom_domain = true },
  { pattern = "tripwire.deepblocker.ai", custom_domain = true },
]

# Static SPA. The Worker handles /api/*; everything else falls through to assets,
# and unknown routes serve index.html for client-side routing.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# Non-secret configuration. The Supabase URL is public by design (RLS + the
# service-role secret protect the data). The detector endpoint is NOT here — it
# is set as a Worker secret (DEEPFAKE_ROUTER_URL) so this public repo never
# names the internal backend.
SUPABASE_URL = "https://cdmbaujqfnknilruuhht.supabase.co"
DETECTOR_DAILY_CAP = "500"
TRUSTWRIGHT_PUBKEY = "MCowBQYDK2VwAyEARzh2V+SNig7xtfush0GWYhDapfIQff+ADC8EMzRTRlo="
TRUSTWRIGHT_KEY_ID = "k1"
BADGE_TTL_DAYS = "90"
# Comma-separated extra origins allowed to call the API (e.g. a quarantine
# subdomain). Empty = same-origin only, which needs no CORS.
ALLOWED_ORIGINS = ""

# Per-IP-per-route short-window limit (writes + detector). Period must be 10 or 60.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Daily-ceiling counter for the paid detector call. Create the namespace and
# paste its id here before deploy (see header). Until then the detector endpoint
# fails closed (503), which is the safe default.
[[kv_namespaces]]
binding = "DAILY"
id = "7b2cbce3a0c144b282814e3067940219"

# Cloudflare Browser Rendering: the managed headless Chromium the URL scan
# (/api/scan, /api/audit/from-scan) drives in-process. Requires the Workers Paid
# plan. Without this binding those endpoints fail closed (503 scan_unavailable).
[browser]
binding = "BROWSER"

# Cron triggers:
#   */3 * * * *  keep the detector warm across the judging window
#   17 * * * *   hourly ownership re-check (revoke badges whose proof was pulled)
#   23 6 * * *   daily badge-health monitor (re-scan surfaces, alert on drift/expiry)
[triggers]
crons = ["*/3 * * * *", "17 * * * *", "23 6 * * *"]
